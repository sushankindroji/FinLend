server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: always fall back to index.html so deep
    # links / page refreshes on Angular routes work correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sensible cache headers for hashed build assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
